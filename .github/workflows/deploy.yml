# Builds the game and deploys it to Firebase (Hosting + Realtime Database rules)
# every time `main` changes, or when "Run workflow" is pressed in the Actions tab.
# Setup guide: README.md, section "Deploy อัตโนมัติผ่าน GitHub Actions".
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check settings
        run: |
          missing=""
          for name in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_DATABASE_URL FIREBASE_PROJECT_ID FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then missing="$missing Variable:$name"; fi
          done
          if [ "$HAS_SERVICE_ACCOUNT" != "true" ]; then missing="$missing Secret:FIREBASE_SERVICE_ACCOUNT"; fi
          if [ -n "$missing" ]; then
            echo "::error::ยังไม่ได้ตั้งค่าใน GitHub (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: |
          cat > .env.production.local <<ENV
          VITE_FIREBASE_API_KEY=$FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL
          VITE_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
          VITE_FIREBASE_APP_ID=$FIREBASE_APP_ID
          VITE_USE_EMULATOR=false
          ENV
          npx vite build

      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          npx firebase deploy --only hosting,database --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$key"
          echo "### Deployed: https://$FIREBASE_PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
